<section class="detail-page">

  <div class="detail-card" *ngIf="product">

    <p class="eyebrow">Product Overview</p>

    <h2>{{ product.name }}</h2>

    <p class="detail-copy">
      {{ product.description }}
    </p>

    <h3 class="price">
      ₹ {{ product.price }}
    </h3>

    <div class="actions">

      <button type="button"
              (click)="addToCart()">
        Add To Cart
      </button>

      <button type="button"
              routerLink="/products">
        Back
      </button>

    </div>

  </div>

</section>
