<section class="products-page">

  <h2 class="title">
    Products
  </h2>

  <div class="grid">

    <article class="card"
             *ngFor="let p of products">

      <div class="card-body">

        <h3>{{ p.name }}</h3>

        <p>{{ p.brand }}</p>

        <a class="link-button"
           [routerLink]="['/product', p.id]">

          View Detail

        </a>

      </div>

    </article>

  </div>

</section>
