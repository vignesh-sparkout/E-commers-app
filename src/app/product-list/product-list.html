<section class="products-page">

  <div class="hero">
    <h2 class="title">Product Categories</h2>
  </div>

  <div class="grid">

    <article class="card"
             *ngFor="let category of categories">

      <div class="card-body">

        <h3>{{ category }}</h3>

        <div class="actions">

          <a class="link-button"
             [routerLink]="['/category', category]">

            View Products

          </a>

        </div>

      </div>

    </article>

  </div>

</section>
