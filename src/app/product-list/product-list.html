<section class="products-page">

  <div class="hero">

    <p class="eyebrow">
      Explore Collection
    </p>

    <h2 class="title">
      Product Categories
    </h2>

    <p class="subtitle">
      Discover premium gadgets and latest technology products
    </p>

  </div>

  <div class="grid">

    <article class="card"
             *ngFor="let category of categories">

      <div class="card-top">

         <img
    [src]="category.image"
    [alt]="category.name">

        <div class="overlay"></div>

        <div class="category-label">
          {{ category.name }}
        </div>

      </div>

      <div class="card-body">

        <h3>{{ category.name }}</h3>

        <p>
          Explore premium {{ category.name.toLowerCase() }}
          collections with modern features and top quality.
        </p>

        <a class="link-button"
           [routerLink]="['/category', category.name]">

          View Products →

        </a>

      </div>

    </article>

  </div>

</section>
