<h2 class="title">Products</h2>

<div class="grid">
  <div class="card" *ngFor="let p of products">

    <h3>{{ p.name }}</h3>
    <p class="price">₹ {{ p.price }}</p>

    <div class="actions">
      <a [routerLink]="['/product', p.id]">View</a>

      <button (click)="addToCart(p)">
        Add to Cart
      </button>
    </div>

  </div>
</div>
