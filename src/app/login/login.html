<div class="login-container">
  <div class="login-card">
    <p class="eyebrow">Welcome Back</p>
    <h2>Login</h2>
    <p class="intro">Sign in to continue exploring the latest products.</p>

    <form #userForm="ngForm" (ngSubmit)="onSubmit(userForm)">
      <div class="field">
        <label>Full Name</label>
        <input
          type="text"
          name="name"
          [(ngModel)]="user.name"
          required
          #name="ngModel"
          placeholder="Enter your name" />

        <small *ngIf="name.invalid && name.touched">
          Name is required
        </small>
      </div>

      <div class="field">
        <label>Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="user.email"
          required
          email
          #email="ngModel"
          placeholder="Enter your email" />

        <small *ngIf="email.invalid && email.touched">
          Enter a valid email
        </small>
      </div>

      <button type="submit" [disabled]="userForm.invalid">
        Login
      </button>
    </form>
  </div>
</div>
